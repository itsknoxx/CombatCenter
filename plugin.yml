name: CombatCenter
version: '1.0.0'
main: com.budge5045.combatcenter.CombatCenter
api-version: '1.21'
author: itsknox

commands:
  pvp:
    description: Opens Combat Center and manages PvP.
    usage: /pvp
    permission: combatcenter.use

permissions:
  combatcenter.use:
    description: Allows players to use Combat Center.
    default: true

  combatcenter.admin:
    description: Allows administrators to manage Combat Center.
    default: op
